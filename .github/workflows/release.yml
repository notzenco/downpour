name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Downpour ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Installers for Windows, macOS and Linux, and the browser extension.

            **macOS:** download the `.dmg` for your Mac (`aarch64` for Apple silicon, `x64` for Intel). The app is not notarized yet, so the first time, right-click Downpour in Applications and choose **Open**.
            **Windows:** run the `.msi` or `-setup.exe`. SmartScreen may warn about an unrecognized app; choose **More info**, then **Run anyway**.
            **Linux:** use the `.AppImage`, `.deb` or `.rpm`.
            **Browser extension:** unzip `downpour-extension.zip` and load it as described in the README.

  extension:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the browser extension
        run: cd extension && zip -r ../downpour-extension.zip . -x '*.test.js'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" downpour-extension.zip --clobber
