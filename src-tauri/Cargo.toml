[package]
name = "downpour"
version = "0.1.0"
description = "A fast, cross-platform download manager"
authors = ["Zenco"]
license = "MIT"
repository = "https://github.com/notzenco/downpour"
edition = "2024"


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "downpour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2.5.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
url = "2.5.9"
percent-encoding = "2.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy"] }


# Unoptimized HTTP and TLS code cannot keep up with fast links, which makes
# `tauri dev` misleadingly slow. Our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros"] }
